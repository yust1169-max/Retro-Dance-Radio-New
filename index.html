<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Dance Radio</title>
<meta name="description" content="Retro Dance Radio — лучшее танцевальное радио">
<style>
  :root{
    --bg:        #0b0d17;
    --bg-2:      #141826;
    --card:      #1a1f33;
    --accent:    #ff2e93;
    --accent-2:  #7c3aed;
    --text:      #eef0f7;
    --muted:     #8892b0;
    --line:      #232a44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(124,58,237,.18), transparent 60%),
      radial-gradient(1000px 500px at 90% 10%, rgba(255,46,147,.14), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,sans-serif;
    min-height:100vh;
    padding:24px 16px 64px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  /* HEADER */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;margin-bottom:28px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 8px 24px rgba(255,46,147,.35);
  }
  .brand h1{
    font-size:20px;margin:0;letter-spacing:.3px;
    background:linear-gradient(90deg,#fff,#c7b8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px;}

  .listeners{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--bg-2);border:1px solid var(--line);
    padding:8px 14px;border-radius:100px;font-size:13px;color:var(--muted);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;background:#22c55e;
    box-shadow:0 0 0 0 rgba(34,197,94,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.6);}
    70%{box-shadow:0 0 0 10px rgba(34,197,94,0);}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
  }

  /* NOW PLAYING */
  .now{
    background:linear-gradient(180deg,var(--card),var(--bg-2));
    border:1px solid var(--line);
    border-radius:24px;padding:24px;
    display:grid;grid-template-columns:220px 1fr;gap:24px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.7);
  }
  @media (max-width:640px){
    .now{grid-template-columns:1fr;padding:18px;gap:18px;}
  }
  .cover-wrap{
    position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;
    background:var(--bg);border:1px solid var(--line);
  }
  .cover-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:opacity .4s ease;
  }
  .cover-wrap img[src=""]{opacity:0;}
  .cover-badge{
    position:absolute;left:12px;bottom:12px;
    background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
    padding:6px 12px;border-radius:100px;font-size:11px;
    letter-spacing:.5px;text-transform:uppercase;color:#fff;
  }

  .meta{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .meta .label{
    font-size:11px;text-transform:uppercase;letter-spacing:2px;
    color:var(--accent);font-weight:600;margin-bottom:8px;
  }
  .meta #artist{
    font-size:24px;font-weight:700;margin:0 0 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .meta #title{
    font-size:18px;font-weight:500;color:#cfd6ee;margin:0 0 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .meta #album{
    font-size:13px;color:var(--muted);margin:0 0 16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* CONTROLS */
  .controls{display:flex;align-items:center;gap:14px;margin-top:auto;}
  .play-btn{
    width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;font-size:20px;display:grid;place-items:center;
    box-shadow:0 10px 30px -8px rgba(255,46,147,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .play-btn:hover{transform:scale(1.05);}
  .play-btn:active{transform:scale(.97);}
  .play-btn.playing{box-shadow:0 10px 30px -8px rgba(124,58,237,.7);}

  .progress{
    flex:1;min-width:0;
    display:flex;flex-direction:column;gap:6px;
  }
  .bar{
    height:6px;border-radius:100px;background:var(--line);overflow:hidden;position:relative;
  }
  .bar > i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:100px;transition:width .9s linear;
  }
  .times{
    display:flex;justify-content:space-between;
    font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  }

  /* VOLUME */
  .volume{display:flex;align-items:center;gap:8px;}
  .volume input[type=range]{
    -webkit-appearance:none;appearance:none;height:4px;border-radius:4px;
    background:var(--line);outline:none;width:90px;cursor:pointer;
  }
  .volume input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 4px rgba(255,46,147,.25);cursor:pointer;
  }
  .volume input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;border:none;
    background:#fff;box-shadow:0 0 0 4px rgba(255,46,147,.25);cursor:pointer;
  }
  .vol-icon{color:var(--muted);font-size:16px;}

  /* NEXT */
  .next{
    margin-top:20px;background:var(--bg-2);border:1px solid var(--line);
    border-radius:16px;padding:14px 18px;
    display:flex;align-items:center;gap:14px;
  }
  .next .k{
    font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);flex-shrink:0;
  }
  .next .v{
    font-size:14px;color:#cfd6ee;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* HISTORY */
  .history-sec{margin-top:36px;}
  .history-sec h2{
    font-size:14px;text-transform:uppercase;letter-spacing:2px;
    color:var(--muted);font-weight:600;margin:0 0 14px;
  }
  #history{display:flex;flex-direction:column;gap:8px;}
  .history-item{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-2);border:1px solid var(--line);
    border-radius:12px;padding:8px 12px;
    transition:background .15s ease, transform .15s ease;
  }
  .history-item:hover{background:#1d2338;transform:translateX(2px);}
  .history-item img{
    width:42px;height:42px;border-radius:8px;object-fit:cover;
    background:var(--bg);flex-shrink:0;
  }
  .history-text{min-width:0;flex:1;}
  .history-artist{
    font-size:13px;font-weight:600;color:#e6e9f7;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .history-title{
    font-size:12px;color:var(--muted);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* Джинглы — приглушённые. Удалите эти правила, если хотите видеть их как обычные треки. */
  .history-item--jingle{opacity:.6;}
  .history-item--jingle .history-artist{font-style:italic;color:#a8b0d0;}

  footer{
    text-align:center;color:var(--muted);font-size:12px;
    margin-top:48px;padding-top:24px;border-top:1px solid var(--line);
  }
  footer a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-logo">🎧</div>
      <div>
        <h1>Retro Dance Radio</h1>
        <small>лучшее танцевальное радио</small>
      </div>
    </div>
    <div class="listeners">
      <span class="dot"></span>
      <span><b id="listeners">0</b> слушают</span>
    </div>
  </header>

  <section class="now">
    <div class="cover-wrap">
      <img id="cover" src="" alt="Обложка" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22><rect fill=%22%23141826%22 width=%22200%22 height=%22200%22/><text x=%22100%22 y=%22110%22 font-size=%2260%22 text-anchor=%22middle%22>🎵</text></svg>'">
      <div class="cover-badge">в эфире</div>
    </div>

    <div class="meta">
      <div class="label">сейчас играет</div>
      <h2 id="artist">—</h2>
      <p id="title">Загрузка…</p>
      <p id="album"></p>

      <div class="controls">
        <button id="playBtn" class="play-btn" aria-label="Play">▶</button>

        <div class="progress">
          <div class="bar"><i id="progressBar"></i></div>
          <div class="times">
            <span id="elapsed">0:00</span>
            <span id="remaining">0:00</span>
          </div>
        </div>

        <div class="volume">
          <span class="vol-icon">🔊</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </section>

  <div class="next">
    <span class="k">далее</span>
    <span class="v" id="nextTitle">—</span>
  </div>

  <section class="history-sec">
    <h2>История эфира</h2>
    <div id="history"></div>
  </section>

  <footer>
    © Retro Dance Radio · <a href="https://t.me/retrodance_radio" target="_blank" rel="noopener">Telegram</a>
  </footer>

</div>

<audio id="player" preload="none" crossorigin="anonymous"></audio>

<script>
(function(){
  'use strict';

  // ============ CONFIG ============
  var STREAM_URL     = 'https://stream.laut.fm/retrodance'; // аудио — laut.fm, НЕ трогаем
  var AZURA_API      = 'https://radio.retrodanceradio.com/api/nowplaying_static/retro_dance_radio.json';
  var AZURA_FALLBACK = 'https://radio.retrodanceradio.com/api/nowplaying/retro_dance_radio';
  var POLL_MS        = 10000;   // опрос API (мс)
  var PROGRESS_MS    = 1000;    // локальный тик прогресс-бара
  var META_OFFSET    = 0;       // сдвиг метаданных, сек. Поставьте 5..15, если метаданные опережают звук
  var HISTORY_LIMIT  = 12;      // сколько треков показывать в истории

  // ============ HELPERS ============
  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function fmt(sec){
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ============ STATE ============
  var current = null;
  var audio   = $('player');

  // ============ AUDIO PLAYER ============
  function setupAudio(){
    audio.src = STREAM_URL;
    audio.volume = parseFloat($('volume').value) || 0.8;

    $('playBtn').addEventListener('click', function(){
      if(audio.paused){
        audio.play().catch(function(e){ console.error('[RD] play failed:', e); });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play',  function(){ $('playBtn').textContent = '❚❚'; $('playBtn').classList.add('playing'); });
    audio.addEventListener('pause', function(){ $('playBtn').textContent = '▶';  $('playBtn').classList.remove('playing'); });
    audio.addEventListener('error', function(){ console.warn('[RD] audio error:', audio.error && audio.error.code); });

    $('volume').addEventListener('input', function(e){
      audio.volume = parseFloat(e.target.value);
    });
  }

  // ============ FETCH META ============
  function fetchNow(){
    fetch(AZURA_API, {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(onData)
      .catch(function(err){
        console.warn('[RD] static failed (' + err.message + '), using fallback');
        fetch(AZURA_FALLBACK, {cache: 'no-store'})
          .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(onData)
          .catch(function(e2){ console.error('[RD] fallback failed:', e2.message); });
      });
  }

  function onData(data){
    if(!data) return;
    var np = data.now_playing;
    if(!np || !np.song) return;

    var s   = np.song;
    var key = (s.artist || '') + ' - ' + (s.title || '');

    if(!current || current.key !== key){
      current = {
        key:       key,
        artist:    s.artist || '',
        title:     s.title  || '',
        album:     s.album  || '',
        art:       s.art    || '',
        played_at: np.played_at,
        duration:  np.duration || 0
      };
      renderCurrent(current);
    } else {
      // уточняем тайминги на случай пересчёта на сервере
      current.played_at = np.played_at;
      if(np.duration) current.duration = np.duration;
    }

    renderListeners(data.listeners);
    renderNext(data.playing_next);
    renderHistory(data.song_history);
  }

  // ============ RENDER ============
  function renderCurrent(t){
    $('artist').textContent = t.artist || 'Retro Dance Radio';
    $('title').textContent  = t.title  || '';
    $('album').textContent  = t.album  || '';

    if(t.art){
      // предзагрузка, чтобы не мигало
      var pre = new Image();
      pre.onload = function(){ $('cover').src = t.art; };
      pre.onerror = function(){ /* оставляем заглушку */ };
      pre.src = t.art;
    }

    document.title = (t.artist ? t.artist + ' — ' : '') + (t.title || 'Retro Dance Radio');
    console.log('[RD] now:', t.artist, '—', t.title, '| art:', t.art ? 'yes' : 'no');
  }

  function renderListeners(l){
    if(!l) return;
    $('listeners').textContent = l.current || l.total || 0;
  }

  function renderNext(pn){
    if(!pn || !pn.song){ $('nextTitle').textContent = '—'; return; }
    $('nextTitle').textContent = (pn.song.artist || '') + ' — ' + (pn.song.title || '');
  }

  function renderHistory(hist){
    var box = $('history');
    if(!box || !Array.isArray(hist)) return;

    var html = '';
    var count = 0;

    for(var i = 0; i < hist.length && count < HISTORY_LIMIT; i++){
      var s = hist[i].song;
      if(!s) continue;

      var isJingle = (s.artist === 'RetroDance Radio');
      var cls  = 'history-item' + (isJingle ? ' history-item--jingle' : '');

      // У джинглов "artist" и "title" слегка пересекаются — оставляем оба поля как есть.
      var artist = esc(s.artist);
      var title  = esc(s.title);

      html +=
        '<div class="' + cls + '">' +
          '<img src="' + esc(s.art) + '" alt="" loading="lazy" ' +
               'onerror="this.style.visibility=\'hidden\'">' +
          '<div class="history-text">' +
            '<div class="history-artist">' + artist + '</div>' +
            '<div class="history-title">'  + title  + '</div>' +
          '</div>' +
        '</div>';
      count++;
    }
    box.innerHTML = html;
  }

  // ============ PROGRESS ============
  function tickProgress(){
    if(!current || !current.duration) return;

    var now       = Math.floor(Date.now() / 1000) - META_OFFSET;
    var elapsed   = Math.max(0, now - current.played_at);
    var remaining = Math.max(0, current.duration - elapsed);
    var pct       = Math.min(100, (elapsed / current.duration) * 100);

    $('progressBar').style.width = pct + '%';
    $('elapsed').textContent     = fmt(elapsed);
    $('remaining').textContent   = '-' + fmt(remaining);
  }

  // ============ BOOT ============
  setupAudio();
  fetchNow();
  setInterval(fetchNow, POLL_MS);
  setInterval(tickProgress, PROGRESS_MS);

  // для отладки из консоли
  window.RD = {
    fetchNow: fetchNow,
    get current(){ return current; },
    get audio(){ return audio; }
  };
})();
</script>
</body>
</html>
